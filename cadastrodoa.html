
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Doadores</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <h1>Eco Ponto Solidário</h1>

    <h2>Cadastro de Doadores</h2>

    <p>Preencha os dados para realizar seu cadastro.</p>

    <form>

        <label>Tipo de doador:</label>
        <select>
            <option>Selecione</option>
            <option>Pessoa Física</option>
            <option>Empresa</option>
        </select>

        <br><br>

        <label>Nome completo ou empresa:</label>
        <input type="text">

        <br><br>

        <label>CPF ou CNPJ:</label>
        <input type="text">

        <br><br>

        <label>Telefone:</label>
        <input type="text">

        <br><br>

        <label>E-mail:</label>
        <input type="email">

        <br><br>

        <label>Endereço:</label>
        <input type="text">

        <br><br>

        <button type="button">Cadastrar doador</button>

    </form>

</body>
</html>
